<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CommitFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="container">
    <header class="header">
      <div class="logo-area">
        <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
        <div class="brand-text">
          <h1>CommitFlow</h1>
        </div>
      </div>
      <div class="live-indicator">
        <span class="pulse-dot"></span>
        <span>Dashboard Online</span>
      </div>
    </header>

    <!-- Stats Summary Cards -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon-wrapper users">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <div class="stat-info">
          <h3>Total Unique Users</h3>
          <p id="totalUsers">0</p>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-wrapper syncs">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
          </svg>
        </div>
        <div class="stat-info">
          <h3>Total Sync Actions</h3>
          <p id="totalSyncs">0</p>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-wrapper problems">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </div>
        <div class="stat-info">
          <h3>Total Problems Synced</h3>
          <p id="totalProblems">0</p>
        </div>
      </div>
    </section>

    <!-- Table Section -->
    <section class="table-card">
      <div class="table-header">
        <h2>Active User Log</h2>
        <div class="search-box">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search by user or repo..." autocomplete="off">
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>GitHub User</th>
              <th>Target Repository</th>
              <th>Action / Mode</th>
              <th>Problems Synced</th>
              <th>Extension Version</th>
              <th>Sync Date</th>
            </tr>
          </thead>
          <tbody id="logBody">
            <tr>
              <td colspan="6" class="placeholder-row">Loading logs from database...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
